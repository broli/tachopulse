# TachoPulse - Hardware Telemetry Widget for Noctalia v5
# Discovers hardware and storage sensors with configurable gauge visuals.

id = "broli/tachopulse"
name = "TachoPulse"
version = "1.0.0"
plugin_api = 32
author = "broli"
license = "GPL-2.0-or-later"
dependencies = ["python3"]
tags = ["system", "hardware", "monitor", "gpu", "cpu", "sensors", "desktop", "storage"]
icon = "gauge"
description = "Universal hardware and storage telemetry super-widget with modular face elements, glowing tachometers, and KDE-style sensor picker."

[[setting]]
key = "poll_interval_ms"
type = "int"
label_key = "settings.poll_interval_ms.label"
description_key = "settings.poll_interval_ms.description"
default = 2000
min = 500
max = 10000

[[setting]]
key = "bar_gauge_size"
type = "int"
label_key = "settings.bar_gauge_size.label"
description_key = "settings.bar_gauge_size.description"
default = 34
min = 22
max = 96

[[setting]]
key = "desktop_gauge_size"
type = "int"
label_key = "settings.desktop_gauge_size.label"
description_key = "settings.desktop_gauge_size.description"
default = 96
min = 56
max = 160

[[service]]
id = "daemon"
entry = "service.luau"

# --- Bar Widget (User adds as many named instances as desired) ---

[[widget]]
id = "gauge"
entry = "bar.luau"

  [[widget.setting]]
  key = "instance_id"
  type = "string"
  label_key = "settings.instance_id.label"
  description_key = "settings.instance_id.description"
  default = "default"

# --- Desktop Widget (User adds as many named instances as desired) ---

[[desktop_widget]]
id = "desktop"
entry = "desktop.luau"

  [[desktop_widget.setting]]
  key = "instance_id"
  type = "string"
  label_key = "settings.instance_id.label"
  description_key = "settings.instance_id.description"
  default = "default"

# --- Interactive Configuration Studio & Sensor Picker ---

[[panel]]
id = "panel"
entry = "panel.luau"
width = 820
height = 680
placement = "attached"
position = "auto"
open_near_click = true
